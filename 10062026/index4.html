<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="p-6 bg-green-100 "><center>

    <div class="p-6 bg-green-300 text-green-800">
        <h1 class="text-xl font-bold">Veri akışı zincirleme</h1>
        <button id="btn-start" class="bg-green-200">Siparişi Detaylandır</button>
        <div id="result" class="mt-4 white-space-pre-line">İşlem Başlatılmadı</div>
    </div>

    <script>

       const kullaniciGetir=()=>{
        return new Promise((resolve)=>{
            setTimeout(()=>{
                resolve({id:42,ad:'Berna', uyelik:'Standart'})
            },2000)
        })
       }

        const sepetiGetir=(kullanici)=>{
            return new Promise((resolve)=>{
            setTimeout(()=>{
                resolve({
                    sahip:kullanici.ad,
                    urunler:['Akıllı Saat', 'Rimel']
                })
              },1000)
           })
        }

        const faturaHesapla=(sepet=>{
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    resolve(`Müşteri:${sepet.sahip}\Ürünler: ${sepet.urunler.join(', ')}\nFatura Tutarı 2350 TL (Kargo Bedava)`)
                },2000)
            })
        })

        document.getElementById('btn-start').addEventListener('click', ()=>{
            const output=document.getElementById('result');
            output.innerText='Müşteri Sorgulanıyor...';


        kullaniciGetir().then((kullanici)=>{
                output.innerText=`Müşteri Bulundu:${kullanici.ad}\nSepet Aranıyor...`;
                return sepetiGetir(kullanici);
            }).then((sepet)=>{
                output.innerText=`Sepet alındı:${sepet.urunler.join(', ')}\nFatura Hesaplanıyor...`;
                return faturaHesapla(sepet);
            }).then((faturaOzeti)=>{
                output.innerText=faturaOzeti;
            })
        })

    </script>


    </center>
</body>
</html>
