<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Değiştir</h1>
     <button id="change">tıkla</button>
     <p id="yazi">değiştir</p>

     <script>
        let buton = document.getElementById('change');
        let yazi = document.getElementById('yazi');
        let tiklama = 0;
        
        buton.addEventListener("click" , function(){
            tiklama++;
            if(tiklama==1){
                yazi.textContent="ESRA";
            }
            else if(tiklama==2) {
                yazi.textContent="AYGEN";
            }
        } )
        </script>
</body>
</html>
